<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Панель администратора</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter;background:#eef2f5}.container{max-width:1200px;margin:0 auto;padding:30px 20px}.admin-card{background:white;border-radius:32px;padding:28px;margin-bottom:32px;box-shadow:0 8px 20px rgba(0,0,0,0.05)}h2{margin-bottom:20px}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}.delete-btn{background:#dc2626;color:white;border:none;padding:4px 12px;border-radius:30px;cursor:pointer}.login-box{max-width:400px;margin:100px auto;background:white;padding:32px;border-radius:32px}
</style></head>
<body id="adminBody">
<script>
    let logged = sessionStorage.getItem('adminAuth');
    if(!logged) {
        const pwd = prompt("Введите пароль администратора:");
        if(pwd === "admin123") { sessionStorage.setItem('adminAuth','true'); location.reload(); }
        else { document.body.innerHTML = '<div style="text-align:center;margin-top:100px"><h2>Доступ запрещен</h2><a href="index.html">На главную</a></div>'; }
    } else {
        document.write(`
        <div class="container"><div class="admin-card"><h2><i class="fas fa-tachometer-alt"></i> Управление заявками</h2><div id="bookingsList"></div></div>
        <div class="admin-card"><h2>Сообщения обратной связи</h2><div id="messagesList"></div></div>
        <div class="admin-card"><h2>Управление расписанием (демо-удаление)</h2><div id="trainingsList"></div></div>
        <p style="text-align:center"><a href="index.html">Вернуться на сайт</a></p></div>
        <script>
            function renderBookings() {
                let bookings = JSON.parse(localStorage.getItem('bookings')) || [];
                const container = document.getElementById('bookingsList');
                if(container) container.innerHTML = bookings.length ? '<table><thead><tr><th>ID</th><th>Клиент</th><th>Занятие</th><th>Телефон</th><th>Дата</th><th></th></tr></thead><tbody>' + 
                bookings.map(b => `<tr><td>${b.id}</td><td>${b.clientName}</td><td>${b.trainingName}</td><td>${b.phone}</td><td>${b.date}</td><td><button class="delete-btn" onclick="deleteBooking(${b.id})">Удалить</button></td></tr>`).join('') + '</tbody></table>' : '<p>Нет заявок</p>';
            }
            window.deleteBooking = function(id) {
                let bookings = JSON.parse(localStorage.getItem('bookings')) || [];
                bookings = bookings.filter(b => b.id !== id);
                localStorage.setItem('bookings', JSON.stringify(bookings));
                renderBookings();
            };
            function renderMessages() {
                let msgs = JSON.parse(localStorage.getItem('contacts')) || [];
                const container = document.getElementById('messagesList');
                if(container) container.innerHTML = msgs.length ? msgs.map(m => `<div style="border-bottom:1px solid #ccc;padding:10px;"><strong>${m.name}</strong> (${m.email}): ${m.message}<br><small>${m.date}</small></div>`).join('') : '<p>Нет сообщений</p>';
            }
            function renderTrainingsAdmin() {
                let trainings = JSON.parse(localStorage.getItem('trainings')) || [];
                const container = document.getElementById('trainingsList');
                if(container) container.innerHTML = trainings.map(t => `<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee;">${t.day} ${t.time} — ${t.activity} (тренер ${t.trainer}) <button class="delete-btn" onclick="removeTraining(${t.id})">Удалить</button></div>`).join('');
            }
            window.removeTraining = function(id) {
                let trainings = JSON.parse(localStorage.getItem('trainings')) || [];
                trainings = trainings.filter(t => t.id !== id);
                localStorage.setItem('trainings', JSON.stringify(trainings));
                renderTrainingsAdmin();
            };
            renderBookings(); renderMessages(); renderTrainingsAdmin();
        <\/script>`);
    }
</script>
</body>
</html>
