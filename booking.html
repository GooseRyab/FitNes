<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Запись на тренировку</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter;background:#f9fafc}.container{max-width:800px;margin:0 auto;padding:30px 20px}.card{background:white;border-radius:32px;padding:32px;box-shadow:0 20px 35px rgba(0,0,0,0.05)}h2{margin-bottom:24px}.form-group{margin-bottom:20px}label{font-weight:600;display:block;margin-bottom:8px}input,select{width:100%;padding:14px;border-radius:30px;border:1px solid #ccd7e6}.btn-primary{background:#ff6b3d;width:100%;padding:14px;border:none;border-radius:40px;color:white;font-weight:bold;font-size:1.1rem;cursor:pointer}.btn-primary:hover{background:#e55a2c}.back-link{display:inline-block;margin-top:20px}
</style></head>
<body>
    <div class="container">
        <div class="card"><h2><i class="fas fa-calendar-plus"></i> Онлайн-запись</h2>
            <form id="bookingForm">
                <div class="form-group">
                    <label>Выберите занятие *</label>
                    <select id="trainingSelect" required></select>
                </div>
                <div class="form-group">
                    <label>Ваше имя *</label>
                    <input type="text" id="clientName" required placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label>Телефон *</label>
                    <input type="tel" id="clientPhone" required placeholder="+7 999 123 45 67">
                </div>
                <div class="form-group">
                    <label>Email (по желанию)</label>
                    <input type="email" id="clientEmail" placeholder="mail@example.com">
                </div>
                <button type="submit" class="btn-primary">Отправить заявку</button>
            </form>
            <div id="msg"></div><a href="schedule.html" class="back-link">← Вернуться к расписанию</a>
        </div>
    </div>
<script>
    const trainings = JSON.parse(localStorage.getItem('trainings')) || [];
    const select = document.getElementById('trainingSelect');
    const prebookId = localStorage.getItem('prebookId');
    if(select) {
        select.innerHTML = trainings.map(t => `<option value="${t.id}" ${prebookId == t.id ? 'selected' : ''}>${t.day} ${t.time} — ${t.activity} (тренер: ${t.trainer})</option>`).join('');
        localStorage.removeItem('prebookId');
    }
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const trainingId = parseInt(document.getElementById('trainingSelect').value);
        const name = document.getElementById('clientName').value.trim();
        const phone = document.getElementById('clientPhone').value.trim();
        const email = document.getElementById('clientEmail').value;
        if(!name || !phone) { alert('Заполните имя и телефон'); return; }
        const selectedTraining = trainings.find(t => t.id === trainingId);
        if(!selectedTraining) return;
        const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
        const newBooking = { id: Date.now(), trainingId, trainingName: `${selectedTraining.day} ${selectedTraining.time} ${selectedTraining.activity}`, clientName: name, phone, email, date: new Date().toLocaleString() };
        bookings.push(newBooking);
        localStorage.setItem('bookings', JSON.stringify(bookings));
        document.getElementById('msg').innerHTML = '<div class="alert-success" style="margin-top:16px;padding:12px;background:#d1e7dd;border-radius:20px;">✅ Заявка успешно отправлена! Администратор свяжется с вами.</div>';
        this.reset();
        setTimeout(() => window.location.href='index.html', 2000);
    });
</script>
</body>
</html>
